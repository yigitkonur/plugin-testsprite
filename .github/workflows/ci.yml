name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  manifests:   # kit:manifests:start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Install Claude Code CLI (for plugin validate)
        run: npm install -g @anthropic-ai/claude-code
      - name: Manifests, versions, install policy, kit copies, rendered blocks
        run: python3 scripts/kit/check-manifests.py --validate
      - name: Secret scan (tree and history)
        run: python3 scripts/kit/secret-scan.py --tree --history
      - name: Local markdown links
        run: python3 scripts/kit/check-links.py
  # kit:manifests:end
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install the pinned CLI (help and version only; no credentials, no network calls to TestSprite)
        run: |
          mkdir /tmp/cli && cd /tmp/cli && npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund @testsprite/testsprite-cli@0.15.0
      - name: Unit and hook tests
        env:
          TS_TEST_CLI_BIN: /tmp/cli/node_modules/.bin
        run: node --test tests/*.test.mjs
      - name: Every testsprite command and flag in the plugin exists in the pinned CLI
        run: python3 -I scripts/flag_trace.py
      - name: Shell syntax
        run: for f in hooks/*.sh scripts/*.sh; do sh -n "$f"; done
      - name: No secrets, personal paths or personal addresses
        run: sh scripts/secret_scan.sh
  plugin-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code
      - name: Skills and agents validate
        run: |
          claude plugin validate --strict skills
          claude plugin validate --strict agents
      - name: Codex marketplace and hook config parse
        run: node -e "const r=f=>JSON.parse(require('fs').readFileSync(f,'utf8')); r('.agents/plugins/marketplace.json'); r('hooks/codex-hooks.json')"
      - name: Inventory and always-on context budget
        run: sh scripts/check_budget.sh 400
